spring:
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          model: ${GOOGLE_GENAI_MODEL:gemini-3.1-flash-lite}
agent:
  model:
    prompts:
      action-system: classpath:/prompts/action/system.md
      action-context: classpath:/prompts/action/context.st
      action-latest-answer-feedback: classpath:/prompts/action/latest-answer-feedback.st
      verification-system: classpath:/prompts/verification/system.md
      verification-context: classpath:/prompts/verification/context.st
      tool-root: classpath:/prompts/tools/
    rate-limit:
      requests-per-minute: ${AGENT_MODEL_RPM:15}
      input-tokens-per-minute: ${AGENT_MODEL_INPUT_TPM:250000}
      requests-per-day: ${AGENT_MODEL_RPD:500}
      provider-retry-fallback: ${AGENT_MODEL_RETRY_FALLBACK:1m}

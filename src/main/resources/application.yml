spring:
  profiles:
    active: dev
  application:
    name: java-system-agent
  http:
    client:
      connect-timeout: 10s
      read-timeout: 180s
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          model: ${GOOGLE_GENAI_MODEL:gemini-3.1-flash-lite}

agent:
  answer-verification:
    mode: ${AGENT_ANSWER_VERIFICATION_MODE:llm}
  codebase:
    base-url: ${CODEBASE_SERVICE_BASE_URL:http://localhost:8081}
    api-token: ${CODEBASE_SERVICE_API_TOKEN:}
    connect-timeout: 2s
    read-timeout: 15s

logging:
  level:
    '[com.java.system.agent]': INFO

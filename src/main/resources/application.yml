spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  application:
    name: java-system-agent

slack:
  app-token: ${SLACK_APP_TOKEN:}
  bot-token: ${SLACK_BOT_TOKEN:}
  signing-secret: ${SLACK_SIGNING_SECRET:}

entry-point:
  call-graph-depth: 3

agent:
  memory:
    max-conversations: 500
  loop:
    analyst:
      max-turns: 12
      max-wall-ms: 120000
      no-progress-limit: 2
    translator:
      max-turns: 6
      max-wall-ms: 60000
    rate-limit:
      enabled: ${GOOGLE_GENAI_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${GOOGLE_GENAI_RPM:30}
      tokens-per-minute: ${GOOGLE_GENAI_TPM:1000000}
      requests-per-day: ${GOOGLE_GENAI_RPD:1500}
    trace:
      enabled: true
      retain: 20
      max-conversations: 200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    displayRequestDuration: true

logging:
  level:
    '[com.java.system.agent]': DEBUG
    '[org.springframework.ai]': DEBUG

git:
  username: ${GIT_USERNAME:}
  token: ${GIT_TOKEN:}
  repos:
    test-repo:
      url: ${REPO_TEST_URL:}
      api-host: ${REPO_TEST_API_HOST:}
      default-branch: ${REPO_TEST_DEFAULT_BRANCH:main}

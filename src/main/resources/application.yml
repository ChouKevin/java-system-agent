spring:
  profiles:
    active: dev
    group:
      slack-agent:
        - agent-runtime
  application:
    name: java-system-agent
  http:
    client:
      connect-timeout: 10s
      read-timeout: 180s
  ai:
    model:
      chat: none

agent:
  answer-verification:
    mode: ${AGENT_ANSWER_VERIFICATION_MODE:llm}
  codebase:
    base-url: ${CODEBASE_SERVICE_BASE_URL:http://localhost:8081}
    api-token: ${CODEBASE_SERVICE_API_TOKEN:}
    connect-timeout: 2s
    read-timeout: 15s

logging:
  level:
    '[com.java.system.agent]': INFO
